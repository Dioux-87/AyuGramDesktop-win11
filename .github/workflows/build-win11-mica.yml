name: Build Windows 11 Mica

# Build "solo browser".
#
# v6: NON usa git apply, NON usa azioni Linux-only, corregge prepare.py per i
#     repository MSYS2 del 2026 e cattura l'output completo di "Prepara le
#     librerie" (prepare.log), cosi' se fallisce si vede il vero messaggio.
# v7: garantisce nasm (lo pretende OpenSSL) e gperf installandoli esplicitamente
#     da MSYS2 e, se manca, scaricando NASM ufficiale come riserva.
# v8: garantisce anche jom (prepare.py lo cerca in ThirdParty\jom ma il pacchetto
#     ufficiale si scompatta in ThirdParty\jom_1_1_3) e perl; mostra l'output a
#     partire dall'ultimo "BUILDING:" invece delle sole ultime righe.
# v9: prepare.py: `pacman -Syu` non blocca piu' l'installazione dei pacchetti
#     (uccideva la shell e lasciava lo stage "riuscito" ma senza nasm/perl).
#     Inoltre ripristina la cache anche se l'ultima run e' fallita (restore-keys).
# v10: l'output di "Prepara le librerie" torna VISIBILE in diretta (Tee-Object)
#     pur restando salvato in prepare.log per la diagnosi.
# v11: la cache delle librerie viene salvata ANCHE se la run fallisce, e
#     prepare.py non fa piu' domande interattive ("(r)ebuild ... (q)uit?").
# v12: rimosso lo scaricamento di Strawberry Perl (Expand-Archive falliva con
#     "Cannot find an overload for ExtractToDirectory": il perl che serve e'
#     quello di MSYS2, gia' installato allo stage 2).
# v13: percorsi ASSOLUTI per Configure e Compila. Prima "Compila" usava
#     TBuild\tdesktop\out ma girava gia' dentro TBuild/, quindi cercava
#     TBuild/TBuild/tdesktop/out (errore "is not a directory").
# v14: la compilazione viene registrata in build.log e, se fallisce, il workflow
#     stampa da solo tutte le righe "error C..../error LNK..../fatal error",
#     cosi' l'errore vero e' visibile senza cercarlo in 50.000 righe di log. I file modificati (e quelli nuovi della modifica Mica)
# sono già nel repository, caricati così come sono: non serve applicare patch,
# quindi non ci sono conflitti possibili con l'upstream.
#
# I runner Windows hanno il workspace su D: con ~200 GB liberi: lo spazio non
# e' un problema (la pulizia va fatta solo sui runner Linux).
#
# Avvio: tab Actions -> "Build Windows 11 Mica" -> Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    name: Windows x64 (Release)
    runs-on: windows-2022
    timeout-minutes: 350
    env:
      TDESKTOP_API_ID: '2040'
      TDESKTOP_API_HASH: 'b18441a1ff607e10a989891a5462e627'
      Platform: x64
    steps:
      - name: Checkout nel layout richiesto dal build (TBuild/tdesktop)
        uses: actions/checkout@v4
        with:
          path: TBuild/tdesktop
          submodules: recursive
          fetch-depth: 1

      - name: Spazio su disco disponibile
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,@{n='GBFree';e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table
          # I runner Windows hanno il workspace su D: con ~200 GB liberi:
          # nessuna pulizia necessaria (in questa modifica non serve).

      - name: Verifica che la modifica Mica sia nel repository
        working-directory: TBuild/tdesktop
        shell: pwsh
        run: |
          $missing = @()
          foreach ($f in @(
            "Telegram/SourceFiles/ayu/features/windows11/windows11.cpp",
            "Telegram/SourceFiles/ayu/features/windows11/windows11.h",
            "Telegram/SourceFiles/ayu/features/windows11/platform/platform_windows11.h",
            "Telegram/SourceFiles/ayu/features/windows11/platform/win/windows11_win.cpp"
          )) { if (-not (Test-Path $f)) { $missing += $f } }
          if ($missing.Count -gt 0) {
            Write-Host "ERRORE: mancano questi file della modifica:"
            $missing | ForEach-Object { Write-Host "  $_" }
            Write-Host ""
            Write-Host "Carica il contenuto di AyuGram-Win11-files.zip nella radice del repository"
            Write-Host "(Add file -> Upload files, trascina la cartella Telegram)."
            exit 1
          }
          Write-Host "File della modifica presenti."
          Select-String -Path "Telegram/CMakeLists.txt" -Pattern "features/windows11" | ForEach-Object { Write-Host "CMakeLists: OK" }
          Select-String -Path "Telegram/Resources/langs/lang.strings" -Pattern "ayu_MicaEffect" | ForEach-Object { Write-Host "lang.strings: OK" }

      - name: Diagnostica
        shell: pwsh
        run: |
          Write-Host "== Disco =="
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{n='GBFree';e={[math]::Round($_.Free/1GB,1)}} | Format-Table
          Write-Host "== Visual Studio =="
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) { & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath }
          Write-Host "== cmake / python =="
          cmake --version | Select-Object -First 1
          python --version

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Imposta l'ambiente Visual Studio (vcvars64)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not $vswhere) { $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "Visual Studio con C++ non trovato sul runner." }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat non trovato in $vsPath" }
          Write-Host "Uso $vcvars"
          cmd /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              Add-Content -Path $env:GITHUB_ENV -Value "$($matches[1])=$($matches[2])"
            }
          }

      - name: Prova a ripristinare la cache delle librerie
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            TBuild/Libraries
            TBuild/ThirdParty
            TBuild/cache_keys
          key: ayugram-libs-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ayugram-libs-${{ runner.os }}-

      - name: Ripristina la cache anche da una run fallita
        shell: pwsh
        run: |
          # GitHub salva la cache SOLO se il job finisce verde: finche' la build
          # fallisce, la cache "buona" non esiste e ogni run riparte da zero.
          # Questo step recupera l'ultima cache disponibile (anche se di una run
          # fallita e quindi non salvata) usando l'API di GitHub.
          $repo = "${{ github.repository }}"
          $headers = @{ Authorization = "Bearer ${{ github.token }}"; Accept = "application/vnd.github+json" }
          try {
            $caches = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/actions/caches?per_page=100" -Headers $headers
          } catch { Write-Host "Cache API non disponibile: $_"; exit 0 }
          $c = $caches.actions_caches | Where-Object { $_.key -like "ayugram-libs-Windows*" } | Select-Object -First 1
          if (-not $c) { Write-Host "Nessuna cache precedente trovata."; exit 0 }
          Write-Host "Cache trovata: $($c.key) (creata $($c.created_at), usata $($c.last_accessed_at))"
          if (Test-Path "TBuild/Libraries") {
            Write-Host "La cache e' gia' stata ripristinata dallo step precedente."
            exit 0
          }
          Write-Host "Scarico la cache $($c.key) ..."
          $url  = $c.archive_download_url
          $tmp  = Join-Path $env:RUNNER_TEMP "cache.zip"
          Invoke-WebRequest -Uri $url -Headers $headers -OutFile $tmp -MaximumRedirection 5
          Write-Host ("Scaricati {0:N0} MB" -f ((Get-Item $tmp).Length / 1MB))
          New-Item -ItemType Directory -Force -Path "TBuild" | Out-Null
          tar -xf $tmp -C "TBuild"
          Remove-Item $tmp -Force
          Get-ChildItem "TBuild" | Select-Object -ExpandProperty Name

      - name: Assicura nasm e jom (servono a OpenSSL e Qt)
        shell: pwsh
        run: |
          $msys  = "TBuild/ThirdParty/msys64"
          $bash  = Join-Path $msys "usr/bin/bash.exe"
          $mingw = Join-Path $msys "mingw64/bin"
          $nasmMsys = Join-Path $mingw "nasm.exe"

          if (Test-Path $bash) {
            Write-Host "== MSYS2 presente: installo il toolchain mingw64 =="
            & $bash -lc "pacman -S --noconfirm --needed mingw-w64-x86_64-nasm mingw-w64-x86_64-gperf mingw-w64-x86_64-perl mingw-w64-x86_64-pkgconf make diffutils" 2>&1 |
              ForEach-Object { Write-Host $_ }
            Write-Host "exit pacman: $LASTEXITCODE"
          } else {
            Write-Host "MSYS2 non ancora installato: lo installera' prepare.py allo stage 2"
          }

          Write-Host ("nasm.exe in MSYS2: {0}" -f (Test-Path $nasmMsys))
          Write-Host ("gperf.exe in MSYS2: {0}" -f (Test-Path (Join-Path $mingw 'gperf.exe')))

          if (-not (Test-Path $nasmMsys)) {
            Write-Host "== riserva: scarico NASM ufficiale =="
            $zip = "TBuild/ThirdParty/nasm.zip"
            New-Item -ItemType Directory -Force -Path "TBuild/ThirdParty" | Out-Null
            Invoke-WebRequest -Uri "https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath "TBuild/ThirdParty/nasm" -Force
            Remove-Item $zip -Force
          }

          $nasm = Get-ChildItem "TBuild/ThirdParty" -Recurse -Filter "nasm.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $nasm) { throw "nasm non disponibile: OpenSSL non puo' essere configurato" }
          Write-Host "nasm: $($nasm.FullName)"
          & $nasm.FullName -v
          Add-Content -Path $env:GITHUB_PATH -Value $nasm.DirectoryName
          if (Test-Path $mingw) { Add-Content -Path $env:GITHUB_PATH -Value (Resolve-Path $mingw).Path }

          # --- jom: prepare.py lo cerca in ThirdParty\jom, ma il pacchetto
          #     ufficiale si scompatta in ThirdParty\jom_1_1_3 -----------------
          $jomDir = "TBuild/ThirdParty/jom"
          if (-not (Test-Path (Join-Path $jomDir "jom.exe"))) {
            $found = Get-ChildItem "TBuild/ThirdParty" -Recurse -Filter "jom.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($found) {
              New-Item -ItemType Directory -Force -Path $jomDir | Out-Null
              Copy-Item $found.FullName (Join-Path $jomDir "jom.exe") -Force
            } else {
              Write-Host "== jom assente: lo scarico =="
              $zip = "TBuild/ThirdParty/jom.zip"
              Invoke-WebRequest -Uri "https://master.qt.io/official_releases/jom/jom_1_1_3.zip" -OutFile $zip
              New-Item -ItemType Directory -Force -Path $jomDir | Out-Null
              Expand-Archive -Path $zip -DestinationPath $jomDir -Force
              Remove-Item $zip -Force
            }
          }
          if (Test-Path (Join-Path $jomDir "jom.exe")) {
            Add-Content -Path $env:GITHUB_PATH -Value (Resolve-Path $jomDir).Path
            Write-Host "jom: $((Resolve-Path $jomDir).Path)\jom.exe"
          } else { Write-Host "ATTENZIONE: jom non disponibile" }

          # --- perl: quello di MSYS2 (installato allo stage 2) e' quello giusto
          #     per compilare OpenSSL. Non serve scaricare altro. ------------
          $perlMsys = Join-Path $mingw "perl.exe"
          if (Test-Path $perlMsys) { Write-Host "perl (MSYS2): $perlMsys" }
          else { Write-Host "perl (MSYS2) non ancora presente: lo installa lo stage 2" }

      - name: Correggi prepare.py (pacchetti MSYS2 aggiornati)
        working-directory: TBuild/tdesktop
        shell: pwsh
        run: |
          Write-Host "== applico fix-prepare.py =="
          python fix-prepare.py
          if ($LASTEXITCODE -ne 0) { throw "fix-prepare.py ha fallito" }
          Write-Host "== diff delle righe modificate =="
          Select-String -Path "Telegram/build/prepare/prepare.py" -Pattern "diffutils|perl-portable|strawberry" | ForEach-Object { Write-Host $_.Line.Trim() }

      - name: Diagnostica strumenti (perl, nasm, git, jom)
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($tool in @('git','perl','nasm','jom','cmake','cl','diff','patch')) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if ($cmd) { Write-Host ("OK    {0,-6} {1}" -f $tool, $cmd.Source) }
            else      { Write-Host ("MANCA {0}" -f $tool) }
          }
          Write-Host "== versioni =="
          try { perl -v 2>&1 | Select-Object -First 3 | ForEach-Object { Write-Host $_ } } catch { Write-Host "perl non eseguibile" }
          try { nasm -v 2>&1 | ForEach-Object { Write-Host $_ } } catch { Write-Host "nasm assente (verra' fornito dallo step successivo)" }
          Write-Host "== contenuto della cache =="
          if (Test-Path "TBuild/ThirdParty") { Get-ChildItem "TBuild/ThirdParty" | Select-Object -ExpandProperty Name }
          if (Test-Path "TBuild/ThirdParty/msys64/mingw64/bin") {
            Write-Host "-- mingw64/bin (nasm, gperf, perl, make):"
            Get-ChildItem "TBuild/ThirdParty/msys64/mingw64/bin" -Filter "*.exe" -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^(nasm|gperf|perl|make|pkgconf)' } | Select-Object -ExpandProperty Name
          } else { Write-Host "-- MSYS2 non presente nella cache" }
          if (Test-Path "TBuild/Libraries") { Write-Host "-- Libraries:"; Get-ChildItem "TBuild/Libraries" | Select-Object -ExpandProperty Name }

      - name: Prepara le librerie
        working-directory: TBuild
        shell: pwsh
        run: |
          # L'output viene MOSTRATO in diretta (Tee-Object) e salvato in
          # prepare.log per la diagnosi in caso di errore.
          $bat = "tdesktop\Telegram\build\prepare\win.bat"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & cmd /c $bat 2>&1 | Tee-Object -FilePath prepare.log
          $code = $LASTEXITCODE
          Write-Host ("Durata 'Prepara le librerie': {0:N0} minuti" -f $sw.Elapsed.TotalMinutes)

          if ($code -ne 0) {
            Write-Host ""
            Write-Host "##### ERRORI TROVATI NEL LOG #####"
            Get-Content prepare.log |
              Select-String -Pattern 'not recognized|\[ERROR\]|FAILED|fatal error|error C[0-9]|error LNK|CMake Error|No such file' |
              Select-Object -Last 30 | ForEach-Object { Write-Host $_.Line }
            Write-Host ""
            Write-Host "##### OUTPUT DELLO STAGE FALLITO (dall'ultimo BUILDING:) #####"
            $l = Get-Content prepare.log
            $hit = $l | Select-String -Pattern 'BUILDING:' | Select-Object -Last 1
            $i = if ($hit) { $hit.LineNumber } else { [Math]::Max(1, $l.Count - 40) }
            $last = [Math]::Min($l.Count - 1, $i + 59)
            $l[($i - 1)..$last] | ForEach-Object { Write-Host $_ }
            Write-Host "##### FINE #####"
            exit $code
          }
          Write-Host "Prepara le librerie completato."

      - name: Configure
        working-directory: TBuild/tdesktop/Telegram
        shell: cmd
        run: |
          configure.bat x64 -D TDESKTOP_API_ID=%TDESKTOP_API_ID% -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% || exit /b 1
          if not exist "%GITHUB_WORKSPACE%\TBuild\tdesktop\out\CMakeCache.txt" (
            echo ERRORE: configure non ha creato la cartella di build
            dir "%GITHUB_WORKSPACE%\TBuild\tdesktop" /b
            exit /b 1
          )
          echo Configure completato: cartella di build OK

      - name: Compila (Release)
        shell: pwsh
        run: |
          $build = Join-Path $env:GITHUB_WORKSPACE "TBuild\tdesktop\out"
          Write-Host "Compilo in: $build"
          if (-not (Test-Path (Join-Path $build "CMakeCache.txt"))) {
            throw "CMakeCache.txt non trovato in $build"
          }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          # /m senza valore = usa tutti i core; l'output va a schermo e su build.log
          & cmake --build $build --config Release --target Telegram --parallel -- /m 2>&1 |
            Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          Write-Host ("Durata compilazione: {0:N0} minuti" -f $sw.Elapsed.TotalMinutes)

          if ($code -ne 0) {
            $log = Get-Content build.log
            Write-Host ""
            Write-Host "################ QUALUNQUE RIGA CON 'error' ################"
            $log | Select-String -Pattern 'error' -CaseSensitive:$false |
              Select-Object -First 60 | ForEach-Object { Write-Host $_.Line }
            Write-Host ""
            Write-Host "################ ULTIME 120 RIGHE (il guasto e' qui in mezzo) ################"
            $start = [Math]::Max(0, $log.Count - 120)
            $log[$start..($log.Count - 1)] | ForEach-Object { Write-Host $_ }
            Write-Host "##############################################################################"
            exit $code
          }
          Write-Host "Compilazione completata."

      - name: Salva il log della compilazione
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log
          path: build.log
          if-no-files-found: ignore

      - name: Cerca errori nei log allegati
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== file di log disponibili ==="
          Get-ChildItem -Recurse -Include *.log,build.log -ErrorAction SilentlyContinue |
            Select-Object FullName,Length | Format-Table -AutoSize | Out-String | Write-Host
          foreach ($f in @("build.log","TBuild\prepare.log","prepare.log")) {
            if (Test-Path $f) {
              Write-Host "=== ERRORI IN $f ==="
              Get-Content $f | Select-String -Pattern 'error C[0-9]{4}|error LNK[0-9]{4}|fatal error|ERRORE' |
                Select-Object -First 40 | ForEach-Object { Write-Host $_.Line }
            }
          }

      - name: Raccogli l'eseguibile
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\artifacts" | Out-Null
          $exes = Get-ChildItem -Path "TBuild\tdesktop\out" -Recurse -Filter "AyuGram.exe" -ErrorAction SilentlyContinue
          if (-not $exes) { $exes = Get-ChildItem -Path "TBuild\tdesktop\out" -Recurse -Filter "Telegram.exe" -ErrorAction SilentlyContinue }
          foreach ($exe in $exes) {
            Write-Host "Trovato: $($exe.FullName)"
            Copy-Item $exe.FullName "$env:GITHUB_WORKSPACE\artifacts\" -Force
            Get-ChildItem $exe.DirectoryName -Filter *.dll | Copy-Item -Destination "$env:GITHUB_WORKSPACE\artifacts\" -Force
          }
          Get-ChildItem "$env:GITHUB_WORKSPACE\artifacts" | Select-Object Name,Length

      - name: Salva la cache delle librerie (anche se la run fallisce)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            TBuild/Libraries
            TBuild/ThirdParty
            TBuild/cache_keys
          key: ayugram-libs-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Salva il log di "Prepara le librerie"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepare-log
          path: TBuild/prepare.log
          if-no-files-found: ignore

      - name: Upload eseguibile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Win11-Mica-x64
          path: artifacts/**
          if-no-files-found: warn

      - name: Salva la configurazione CMake (per diagnosi)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-cache
          path: |
            TBuild/tdesktop/out/CMakeCache.txt
            TBuild/tdesktop/out/**/*.log
          if-no-files-found: warn
